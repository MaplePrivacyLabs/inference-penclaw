name: Tinfoil Release - Publish
run-name: Measure and publish Tinfoil release ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: tinfoil-release-publish-${{ github.ref_name }}

jobs:
  measure-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Require a stable release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Measurement requires a stable release tag from Tinfoil Release."
            exit 1
          fi

      - name: Check out the tagged configuration
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Validate the tagged configuration
        shell: bash
        run: |
          git ls-files --error-unmatch tinfoil-config.yml >/dev/null
          python3 render_config.py --check --require-pinned-image
          git diff --exit-code -- tinfoil-config.yml

      - name: Measure, attest, and publish the release
        uses: tinfoilsh/measure-image-action@59f7ab5dbe472b3097c888ebe64e6a4131fc0975 # v0.14.0
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Publish the release as latest so Tinfoil can issue a freshness
          # witness for its deployment digest.
          mark-as-latest: 'true'
